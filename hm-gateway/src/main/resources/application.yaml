server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.189.188
    gateway:
      routes:
        - id: user_service  # 路由规则id，自定义，唯一
          uri: lb://user-service  # 路由目标微服务，lb代表负载均衡
          predicates: # 路由断言，判断请求是否符合规则，符合则路由到目的微服务
            - Path=/users/**,/addresses/**  # 以请求路径做判断，以/users或/addresses开头则符合

        - id: item_service
          uri: lb://item-service
          predicates:
            - Path=/items/**,/search/**

        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/orders/**

        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/carts/**

        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/pay-orders/**

hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
    tokenTTL: 30m
  auth:
    excludePaths:
      - /search/**
      - /users/login
      - /items/**
      - /hi